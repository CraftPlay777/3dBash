name: Build 3dBash Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.3 Android export templates
        run: |
          set -eu
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DIR"
          TEMPLATE_URL="https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          wget -O /tmp/godot-4.3-templates.tpz --tries=3 --timeout=30 "$TEMPLATE_URL"
          unzip -t /tmp/godot-4.3-templates.tpz
          unzip -q -o /tmp/godot-4.3-templates.tpz -d /tmp/godot-templates
          test -s /tmp/godot-templates/templates/android_debug.apk
          test -s /tmp/godot-templates/templates/android_release.apk
          cp /tmp/godot-templates/templates/* "$TEMPLATE_DIR/"
          printf '4.3.stable\n' > "$TEMPLATE_DIR/version.txt"
          ls -lh "$TEMPLATE_DIR"

      - name: Configure Java, Android SDK and debug signing
        run: |
          set -eu
          JAVAC_BIN="$(command -v javac)"
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$JAVAC_BIN")")")"
          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/keytool"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Validate project and scripts
        run: godot --headless --editor --path . --quit

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/3dBash.apk
          test -s build/3dBash.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3dBash-Android-APK
          path: build/3dBash.apk
          if-no-files-found: error
